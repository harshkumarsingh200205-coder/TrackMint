name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Smoke Verify
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Run Unit Tests (Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          find src test -name "*.java" > sources.txt
          javac -cp "lib/*" -d out @sources.txt
          java -jar lib/junit-platform-console-standalone-1.10.2.jar execute -cp "out:lib/*" --scan-classpath --disable-banner

      - name: Compile and Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\run_tests.ps1

      - name: Run CLI Smoke Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "3" | java --enable-native-access=ALL-UNNAMED -cp "out;lib/*" com.trackmint.app.Main
